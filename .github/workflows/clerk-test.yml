name: clerk test
on: workflow_dispatch
permissions: { contents: write }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env: { CLERK_AUTH_KEY: "${{ secrets.CLERK_AUTH_KEY }}", CLERK_PROXY_URL: "${{ secrets.CLERK_PROXY_URL }}", N: "5" }
        run: |
          python3 scripts/clerk_test.py > /tmp/clerk_log.txt 2>&1 || true
          sed -i "s#${{ secrets.CLERK_AUTH_KEY }}#***#g" /tmp/clerk_log.txt
          mkdir /tmp/log && cd /tmp/log && cp /tmp/clerk_log.txt . && git init -q && git checkout -q -b data-logs && git add -A && git -c user.name=bot -c user.email=bot@example.com commit -qm log && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" data-logs
