name: probe
on: workflow_dispatch
permissions: { contents: write }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out && cd out
          curl -sSL -A "Mozilla/5.0" https://entp.hud.gov/idapp/html/condlook.cfm -o hud_form.html || true
          curl -sSL -A "Mozilla/5.0" https://lgy.va.gov/lgyhub/condo-report -o va.html || true
          git init -q && git checkout -q -b data-probe && git add -A
          git -c user.name=bot -c user.email=bot@example.com commit -qm probe
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" data-probe
