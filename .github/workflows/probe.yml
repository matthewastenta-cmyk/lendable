name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out
          curl -sSL -A "Mozilla/5.0" https://entp.hud.gov/idapp/html/condlook.cfm -o out/hud_form.html || true
          curl -sSL -A "Mozilla/5.0" https://lgy.va.gov/lgyhub/condo-report -o out/va.html || true
          ls -la out
      - uses: actions/upload-artifact@v4
        with: { name: probe, path: out }
