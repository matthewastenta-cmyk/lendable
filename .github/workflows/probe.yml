name: probe
on: workflow_dispatch
permissions: { contents: write }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out && cd out
          curl -sSL https://lgy.va.gov/lgyhub/condo-report -o va.html
          for f in $(grep -o 'static/js/[^"]*\.js' va.html | sort -u); do curl -sSL "https://lgy.va.gov/lgyhub/$f" >> all.js; echo >> all.js; done
          grep -o 'static/js/"[^;]*' all.js | head -3 > chunkmap.txt || true
          grep -o '[0-9]*:"[0-9a-f]\{8\}"' all.js | sort -u > chunks.txt || true
          for c in $(sed 's/:"\(.*\)"/.\1/' chunks.txt); do curl -sSL "https://lgy.va.gov/lgyhub/static/js/$c.chunk.js" >> lazy.js; echo >> lazy.js; done
          grep -o '.\{200\}condo.\{200\}' lazy.js | head -40 > va_condo_snips.txt || true
          grep -o '"/lgyhub/api[^"]*"' lazy.js all.js | sort -u > va_api.txt || true
          rm -f all.js lazy.js
          git init -q && git checkout -q -b data-probe && git add -A
          git -c user.name=bot -c user.email=bot@example.com commit -qm probe
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" data-probe
