name: clerk daily mortgages
on:
  workflow_dispatch:
  schedule: [{ cron: "23 11 * * *" }]   # every day
permissions: { contents: write }
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          CLERK_AUTH_KEY: "${{ secrets.CLERK_AUTH_KEY }}"
          CLERK_PROXY_URL: "${{ secrets.CLERK_PROXY_URL }}"
          CLERK_FOLDER: "${{ vars.CLERK_FOLDER || secrets.CLERK_FOLDER }}"
        run: |
          set +e
          python3 scripts/ingest_clerk.py > /tmp/clerk_log.txt 2>&1; code=$?
          if [ $code -eq 0 ] && [ -f data/miami_mortgages.json ]; then
            python3 scripts/build_miami.py --lenders-only >> /tmp/clerk_log.txt 2>&1
            git add data/miami_mortgages.json data/miami.json
            git diff --cached --quiet || (git -c user.name="lendable-bot" -c user.email="noreply@anthropic.com" commit -qm "Daily Miami mortgages" && git pull -q --rebase && git push -q)
          fi
          echo "exit $code" >> /tmp/clerk_log.txt
          mkdir /tmp/log && cd /tmp/log && cp /tmp/clerk_log.txt . && git init -q && git checkout -q -b data-logs && git add -A && git -c user.name=bot -c user.email=bot@example.com commit -qm log && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" data-logs
          exit $code
